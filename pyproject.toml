[project]
name = "open-mental-health-collective"
version = "0.1.0"
description = "Open Mental Health Collective (OMHC) is a multi-agent, non-clinical mental-health support prototype built using Google’s Agent Development Kit (ADK) and deployed via Vertex AI Agent Engine."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "google-adk>=1.19.0",
    "google-cloud-aiplatform[adk,agent-engines]>=1.128.0",
    "google-genai>=1.52.0",
    "mcp[cli]>=1.22.0",
    "pydantic>=2.12.4",
    "python-dotenv>=1.2.1",
]

[dependency-groups]
dev = [
    "pytest>=9.0.1",
    "pytest-asyncio>=1.3.0",
    "uvicorn>=0.38.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
